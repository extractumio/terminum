name: ci

# The owner's runner only: never a GitHub-hosted runner, cache or artifact store. This
# repository is public: no pull-request trigger, the runner registered for this repository
# alone, and fork pull requests' workflows wait for the owner's approval (docs/RELEASING.md
# "CI"), so no one else's code runs on it. Pushes and manual runs only.
on:
  push:
  workflow_dispatch:
    inputs:
      live:
        description: "Only web/test/e2e_live.mjs with these words (e.g. 'boardpool webkit'), again and again, to tell a race from the runner's load; empty: the whole run"
        default: ""
      times:
        description: "How many times, with live"
        default: "10"

permissions: {}

# a run on main ends with its verdict: a push meanwhile waits, and GitHub keeps only the newest waiting
# one; on another branch the newest push wins. Repeats wait apart from the checks.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.live && 'repeat' || 'checks' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Tests on Linux (Ubuntu), the page in Chromium and WebKit
    runs-on: [self-hosted, linux, x64, terminum]
    # a passing run takes ~26 min: 9.5 before the page's checks (unit tests 6.7, clippy 1.2, build 1,
    # install 0.5), the Files panel 1, the page 6-7 in each browser (2026-11-10); a build stuck at
    # the memory cap does not fail, it thrashes the disk until cancelled (~60-80 GiB written an hour,
    # 2026-10-31), so 40 min bounds that at ~40-55 GiB; a repeat by hand gets an hour
    timeout-minutes: ${{ inputs.live && 60 || 40 }}
    env:
      # the runner's memory cap (docs/RELEASING.md) sits in a VM shared with coding agents: one
      # rustc at a time, no debug info (two rustc with it took the whole VM out of memory, 2026-10-25)
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      NO_COLOR: "1"
    steps:
      - name: The runner's memory counters before the job
        run: |
          cg="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
          cp "$cg/memory.events" "$RUNNER_TEMP/memory.events.before"
          cp "$cg/../memory.events" "$RUNNER_TEMP/memory.events.parent.before" || true   # said at the end

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Rust (the runner's own, pinned)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"  # where the first run's rustup puts it
          command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Unit tests (Rust, scripts, UI, page)
        if: inputs.live == ''
        # the largest process's peak is rustc's, the number that has to fit under the cap
        # (GNU time is the "time" package: without it the tests run unmeasured, never not at all)
        run: |
          if [ -x /usr/bin/time ]; then /usr/bin/time -f 'largest process peak RSS: %M KiB' make test; else make test; fi

      - name: No warnings
        if: inputs.live == ''
        run: cd terminumd && cargo clippy --locked --all-targets -- -D warnings

      - name: terminumd, the debug build the checks below run
        run: make ui && cd terminumd && cargo build --locked   # its page: built by the unit tests' make test, alone on a repeat

      - name: Install, upgrade, rollback, uninstall (direct mode, a temporary HOME)
        if: inputs.live == ''
        run: TERMINUMD_BIN=terminumd/target/debug/terminumd bash scripts/e2e_install.sh

      - name: Browsers for the page's checks
        run: cd ui && npx playwright-core install chromium webkit

      # The page's own checks (web/test/e2e_all.mjs) measure Safari's and Chrome's layout on the
      # Mac, the page's clients: they run on a Mac (make test-mac), not with Linux's fonts here.
      - name: The Files panel and the page against a private terminumd and tmux
        if: inputs.live == ''
        run: | # each runs, so one run shows every failure
          rc=0
          (cd ui && node test/e2e_panel.mjs) || rc=1
          node web/test/e2e_live.mjs || rc=1
          exit $rc

      - name: The page's live checks named, again and again (a manual run's)
        if: inputs.live != ''
        env:
          LIVE: ${{ inputs.live }}
          TIMES: ${{ inputs.times }}
        run: |
          [[ "$LIVE" =~ ^[a-z\ ]+$ && "$TIMES" =~ ^[1-9][0-9]?$ ]] || { echo "live: words of e2e_live.mjs; times: 1 to 99"; exit 2; }
          failed=0
          for i in $(seq "$TIMES"); do
            if node web/test/e2e_live.mjs $LIVE > "$RUNNER_TEMP/live.log" 2>&1; then said=PASS; else said=FAIL; failed=$((failed + 1)); fi
            echo "::group::$i of $TIMES: $said"; cat "$RUNNER_TEMP/live.log"; echo "::endgroup::"
            grep -E '^FAIL ' "$RUNNER_TEMP/live.log" | sed "s/^/run $i: /" || true
          done
          echo "$failed of $TIMES failed"
          [ "$failed" = 0 ]

      - name: Security checks
        if: inputs.live == ''
        run: bash scripts/security_check.sh

      # a kill here with no cap hit of this job's own came from the group above it, shared with the
      # VM's other runners: its counters say whether that group hit its cap, the others in it how much
      # they use (unnamed: this log is public)
      - name: The runner's memory use (cap hits and OOM kills in this job and the group above it)
        if: always()
        run: |
          cg="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
          delta() { paste "$1" "$2" | awk '{print $1, $4 - $2}' | sed "s/^/$3: /"; }
          peak() { cat "$1/memory.peak" 2>/dev/null || echo -; }
          echo "cap $(cat "$cg/memory.max"), peak since the runner started $(peak "$cg")"
          delta "$RUNNER_TEMP/memory.events.before" "$cg/memory.events" "this job"
          grep -E '^(anon|shmem|file) ' "$cg/memory.stat" | sed 's/^/this job now: /'
          up="$cg/.."
          [ -r "$RUNNER_TEMP/memory.events.parent.before" ] || { echo "the group above: not readable"; exit 0; }
          echo "the group above: cap $(cat "$up/memory.max"), now $(cat "$up/memory.current"), peak $(peak "$up")"
          delta "$RUNNER_TEMP/memory.events.parent.before" "$up/memory.events" "the group above, in this job"
          n=0
          for d in "$up"/*/; do
            if [ "$d" -ef "$cg" ] || [ ! -f "$d/memory.current" ]; then continue; fi
            n=$((n + 1)); echo "another group in it $n: now $(cat "$d/memory.current"), peak $(peak "$d")"
          done
