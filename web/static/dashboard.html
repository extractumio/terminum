<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="build" content="__BUILD__">
<base href="/">
<title>Dashboard · terminum</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="grain.css">
<link rel="stylesheet" href="msgpage.css">
<link rel="stylesheet" href="dashboard.css">
<style id="customcss"></style>
</head>
<body class="msg-page">
<main id="mpage">
  <!-- the shared head of the Message history, Scheduled and the Dashboard (each of history.html, scheduled.html, dashboard.html holds the same): the title for a reader, the sections (sections.js) -->
  <header id="bar" class="wavebar">
    <h1 class="mtitle">Dashboard</h1>
    <nav class="sections seg" aria-label="Sections"></nav>
  </header>
  <!-- /the shared head -->
  <div id="dtools" class="mtools">
    <div id="dtabs" class="seg" role="tablist" aria-label="What to show">
      <button type="button" role="tab" data-tab="you" aria-controls="cards">You</button><button type="button" role="tab" data-tab="system" aria-controls="cards">System</button><button type="button" role="tab" data-tab="costs" aria-controls="cards">Costs</button>
    </div>
    <div id="dperiod" class="seg" role="group" aria-label="Period">
      <button type="button" data-period="day" title="The last 24 hours, by the hour">Day</button><button type="button" data-period="2w" title="The last 14 days">2 weeks</button><button type="button" data-period="month" title="The last 30 days">Month</button><button type="button" data-period="quarter" title="The last 13 weeks, by the week">Quarter</button><button type="button" data-period="year" title="The last 12 months, by the month">Year</button>
    </div>
    <details id="dproject" class="pick"><summary class="textkey" title="The session list's project">All projects</summary><div class="box menurows" role="group" aria-label="Projects"></div></details>
    <span class="mgrow"></span>
    <p id="dnote" class="msum"></p>
  </div>
  <p id="derr" class="merr" role="alert" hidden></p>
  <section id="tiles" aria-label="In short"></section>
  <div id="cards" role="tabpanel"></div>
</main>
<script type="module" src="grain.js"></script>
<script type="module" src="dashboard.js"></script>
</body>
</html>
