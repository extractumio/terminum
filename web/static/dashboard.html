<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="build" content="__BUILD__">
<base href="/">
<title>Dashboard · terminum</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="grain.css">
<link rel="stylesheet" href="msgpage.css">
<link rel="stylesheet" href="dashboard.css">
<style id="customcss"></style>
</head>
<body class="msg-page">
<main id="mpage">
  <!-- the shared head of the Message history and the Dashboard (history.html holds the same) -->
  <header id="bar" class="wavebar">
    <a id="barsessions" class="icon" href="/sessions/" title="Sessions" aria-label="Sessions"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:17px"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/></svg></a>
    <h1 class="mtitle">Dashboard</h1>
    <nav class="seg mpages" aria-label="Pages">
      <a href="/history/"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:14px"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg><span>History</span></a>
      <a href="/dashboard/" aria-current="page"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:14px"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg><span>Dashboard</span></a>
    </nav>
    <span class="mgrow"></span>
    <a id="barkanban" class="icon" href="/kanban/" title="Kanban: tasks and their sessions" aria-label="Kanban"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg></a>
  </header>
  <!-- /the shared head -->
  <div id="dtools" class="mtools">
    <div id="dperiod" class="seg" role="group" aria-label="Period">
      <button type="button" data-days="7">7 days</button><button type="button" data-days="30">30 days</button><button type="button" data-days="90">90 days</button>
    </div>
    <details id="dproject" class="pick"><summary class="textkey" title="The session list's project">All projects</summary><div class="box menurows" role="group" aria-label="Projects"></div></details>
    <span class="mgrow"></span>
    <p id="dnote" class="msum">You only: Dispatcher's messages are not counted. This Mac's time.</p>
  </div>
  <p id="derr" class="merr" role="alert" hidden></p>
  <section id="tiles" aria-label="In short"></section>
  <div id="cards">
    <figure class="card wide" id="cperday">
      <figcaption class="chead"><h2>A day</h2>
        <div id="perdaymode" class="seg" role="group" aria-label="Measure"><button type="button" data-mode="n" aria-pressed="true">Messages</button><button type="button" data-mode="active">Active time</button></div></figcaption>
      <div class="readout"><span id="perdaysay" aria-live="polite"></span><a id="perdaygo" class="textkey" hidden>Open messages</a></div>
      <div id="perdaylegend" class="legend"></div>
      <div id="perday" class="plot" tabindex="0" role="group" aria-label="A day: ← and → choose a day, Enter opens its messages"></div>
    </figure>
    <figure class="card" id="cdays">
      <figcaption class="chead"><h2>Working day</h2><span class="chint" title="From the first to the last thing sent or typed; solid: active stretches (a pause over 15 minutes ends one)">first to last, active solid</span></figcaption>
      <div class="readout"><span id="dayssay" aria-live="polite"></span></div>
      <div id="days" class="plot" tabindex="0" role="group" aria-label="Working day: ← and → choose a day"></div>
    </figure>
    <figure class="card" id="cheat">
      <figcaption class="chead"><h2>When you work</h2><span class="chint" id="heathint">active minutes, an average week</span></figcaption>
      <div class="readout"><span id="heatsay" aria-live="polite"></span></div>
      <div id="heat" class="plot" tabindex="0" role="group" aria-label="Hour by weekday: arrows choose an hour"></div>
    </figure>
    <figure class="card" id="cprojects">
      <figcaption class="chead"><h2>Projects</h2><span class="chint">messages</span></figcaption>
      <div id="projects" class="ranked"></div>
    </figure>
    <figure class="card" id="csessions">
      <figcaption class="chead"><h2>Sessions a day</h2><span class="chint" title="Columns: sessions you sent to that day; dots: the most in one hour">columns: that day, dots: most in an hour</span></figcaption>
      <div class="readout"><span id="sessionssay" aria-live="polite"></span></div>
      <div id="sessions" class="plot" tabindex="0" role="group" aria-label="Sessions a day: ← and → choose a day"></div>
    </figure>
  </div>
</main>
<script type="module" src="grain.js"></script>
<script type="module" src="dashboard.js"></script>
</body>
</html>
