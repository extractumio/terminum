<meta name="theme-color" content="#000000">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">

<link rel="stylesheet" href="style.css">

<body class="msg-page">
<main id="mpage">
  <!-- the shared head of the Message history, Scheduled and the Dashboard (each of history.html, scheduled.html, dashboard.html holds the same): the title for a reader, the sections (sections.js) -->
  <header id="bar" class="wavebar">
    <h1 class="mtitle">Scheduled runs</h1>
    <nav class="sections seg" aria-label="Sections"></nav>
  </header>
  <!-- /the shared head -->
  <div id="stools" class="mtools">
    <nav class="seg mpages" aria-label="Messages' pages">
      <a href="/history/" title="What you sent, searched"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:14px"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg><span>History</span></a>
      <a href="/scheduled/" aria-current="page" title="Every run of a schedule"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:14px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Scheduled</span></a>
    </nav>
    <details id="fschedule" class="pick"><summary class="textkey" title="Which schedule">All schedules</summary><div class="box menurows" role="group" aria-label="Schedules"></div></details>
  </div>
  <p id="ssum" class="msum" role="status"></p>
  <p id="serr" class="merr" role="alert" hidden></p>
  <div id="fires" role="list" aria-label="Firings"></div>
  <div id="sfoot"><button id="smore" class="textkey" type="button" hidden>Show more</button></div>
</main>
<script type="module" src="grain.js"></script>
<script type="module" src="interact.js"></script>
<script type="module" src="scheduled.js"></script>
</body>
</html>
