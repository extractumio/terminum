<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="build" content="__BUILD__">
<base href="/">
<title>Scheduled runs · terminum</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="grain.css">
<link rel="stylesheet" href="msgpage.css">
<link rel="stylesheet" href="taskwin.css">
<link rel="stylesheet" href="scheduled.css">
<style id="customcss"></style>
</head>
<body class="msg-page">
<main id="mpage">
  <!-- the shared head of the Message history, Scheduled and the Dashboard (each of history.html, scheduled.html, dashboard.html holds the same) -->
  <header id="bar" class="wavebar">
    <a id="barsessions" class="icon" href="/sessions/" title="Sessions" aria-label="Sessions"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:17px"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/></svg></a>
    <h1 class="mtitle">Scheduled runs</h1>
    <nav class="seg mpages" aria-label="Pages">
      <a href="/history/"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:14px"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg><span>History</span></a>
      <a href="/scheduled/" aria-current="page"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:14px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Scheduled</span></a>
      <a href="/dashboard/"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true" style="--s:14px"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg><span>Dashboard</span></a>
    </nav>
    <span class="mgrow"></span>
    <a id="barkanban" class="icon" href="/kanban/" title="Kanban: tasks and their sessions" aria-label="Kanban"><svg class="lu" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg></a>
  </header>
  <!-- /the shared head -->
  <div id="stools" class="mtools">
    <details id="fschedule" class="pick"><summary class="textkey" title="Which schedule">All schedules</summary><div class="box menurows" role="group" aria-label="Schedules"></div></details>
  </div>
  <p id="ssum" class="msum" role="status"></p>
  <p id="serr" class="merr" role="alert" hidden></p>
  <div id="fires" role="list" aria-label="Firings"></div>
  <div id="sfoot"><button id="smore" class="textkey" type="button" hidden>Show more</button></div>
</main>
<script type="module" src="grain.js"></script>
<script type="module" src="scheduled.js"></script>
</body>
</html>
