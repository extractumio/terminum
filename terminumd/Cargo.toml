[package]
name = "terminumd"
version = "0.1.0"
edition = "2024"
authors = ["Gregory Zemskov <info@extractum.io>"]
description = "terminum's server: the tmux control client, screens, typing, sessions, files and the embedded page"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }  # the page's WebSocket and the Files API
futures-util = "0.3.34"
# client side of the remote agent proxy (AC-82); already in the tree through axum
http-body-util = "0.1.5"
hyper = { version = "1.11", features = ["client", "server", "http1"] }  # the web listener's connections: head timeout (AC-10)
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }  # a Router served on the web listener's own connections; already in the tree through axum
percent-encoding = "2.3.2"
libc = "0.2.189"
mime_guess = "2.0.5"
notify = "8"
parking_lot = "0.12.5"
rand = "0.9"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"  # sign-ins, the hello proof, PBKDF2 of the web password; already in the tree through rust-embed
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5"
unicode-width = "0.2"  # cells of wide characters in tmux's captures (DEP-01)

[[bench]]
name = "frame"
harness = false

[profile.release]
lto = "thin"
codegen-units = 4
